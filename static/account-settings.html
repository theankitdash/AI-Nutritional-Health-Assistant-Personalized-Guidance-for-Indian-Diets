<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Form</title>
    <link rel="stylesheet" href="/static/css/account-settings.css">
</head>
<body>
    <header>
        <div class="left-header">
            <h2>&copy; Nutri-Health.</h2>
        </div>
        <div class="right-header"></div>
            <nav class="header-menu">
                <ul>
                    <li><a href="/">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="content">
            <header>
                <h1>Account Settings</h1>
                <div class="welcome-section">
                    <h2>Welcome, <span id="welcome-name"></span></h2>
                </div>
            </header>

            <div class="section" id="profile">
                <h2>Profile Settings</h2>
                <div class="setting">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                </div>
                <div class="setting">
                    <label for="dateOfBirth">Date of Birth:</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth">
                </div>
                <div class="setting">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="setting">
                    <label for="height">Height(in cm):</label>
                    <input type="number" id="height" name="height" placeholder="Enter your Height">  
                </div>
                <div class="setting">
                    <label for="weight">Weight(in kg):</label>
                    <input type="number" id="weight" name="weight" placeholder="Enter your Weight">  
                </div>
                <div class="setting button-container">
                    <button id="saveProfileBtn" type="button">Save Profile</button>
                    <button id="changePasswordBtn" type="button">Change Password</button>
                </div>

                <!-- Password Change Modal -->
                <div id="changePasswordModal" class="modal">
                    <div class="modal-content">
                        <span class="close" id="closeModal">&times;</span>
                        <h2>Change Password</h2>
                        <div class="setting">
                            <label for="currentPassword">Current Password:</label>
                            <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter your current password">
                        </div>
                        <div class="setting">
                            <label for="newPassword">New Password:</label>
                            <input type="password" id="newPassword" name="newPassword" placeholder="Enter your new password">
                            <div id="password-feedback"></div>
                        </div>
                        <div class="setting">
                            <button id="submitChangePasswordBtn" type="button">Submit</button>
                        </div>
                    </div>
                </div>

                <div class="logout" id="logout">
                    <button id="logoutBtn" type="button">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/account-settings.js"></script>
</body>
</html>
