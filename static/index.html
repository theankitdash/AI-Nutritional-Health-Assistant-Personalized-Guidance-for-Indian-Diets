<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify-Health</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header>
    <div class="left-header">
      <h2>&copy; Nutrify-Health.</h2>
    </div>
    <div class="right-header"></div>
      <nav class="header-menu">
        <ul>
          <li><a href="/account-settings">Account Settings</a></li>
          <li><button type="button" id="logout-btn">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>  

  <main class="main-content">

    <!-- Chat Section -->
    <div class="chat-container">
      <div class="chat-header">
        <h2>Welcome, <span id="welcome-name"></span></h2>
      </div>

      <div class="chat-messages" id="messages">
        <!-- Messages will appear here -->
      </div>

      <form class="chat-form" id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." required>

        <!-- File Upload Button -->
        <input type="file" id="file-input" hidden>
        <button type="button" id="upload-btn" title="Upload file">&#x1F4CE;</button>

        <button type="submit">Send</button>
      </form>
    </div>
  </main>

  <!-- Login/Register Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modal-title">Login</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
          <div id="email-feedback"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
          <div id="password-feedback"></div>
        </div>
        <div class="form-group" id="confirm-password-group" style="display: none;">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password">
          <div id="confirm-password-feedback"></div>
        </div>
        <button type="submit">Submit</button>
        <button type="button" id="register-btn">Register</button>
      </form>
    </div>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
